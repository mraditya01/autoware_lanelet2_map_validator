name: pre-build-and-upload-binaries

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: The name of the tag to build and upload binaries for
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/autowarefoundation/autoware:core-devel
      options: --user root
    steps:
      - name: Get Release Version
        id: get_version
        run: |
          REF_NAME="${{ github.event.inputs.tag-name }}"
          VERSION=${REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Split into major, minor, patch using more compatible method
          MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION" | cut -d'.' -f3)

          # Default values to 0 if missing
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Reference version 1.5.2
          REF_MAJOR=1
          REF_MINOR=5
          REF_PATCH=2

          # Compare version parts
          if (( MAJOR < REF_MAJOR )) || \
             (( MAJOR == REF_MAJOR && MINOR < REF_MINOR )) || \
             (( MAJOR == REF_MAJOR && MINOR == REF_MINOR && PATCH <= REF_PATCH )); then
            CATEGORY="before_or_equal_1_5_2"
          else
            CATEGORY="after_1_5_2"
          fi

          echo "Category: $CATEGORY"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.get_version.outputs.version }}

      - name: Cherry-pick preparation
        run: |
          cd $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main static_build_helper

      - name: cherry-pick for version <= 1.5.2
        if: steps.get_version.outputs.category == 'before_or_equal_1_5_2'
        run: |
          cd $GITHUB_WORKSPACE
          git cherry-pick b92492bb2232f0c1d502cfc0c6aede2f3169116b || true
          git cherry-pick 8ed41f2f8d59d63c09bb47ac8ad59d4f56c7d07c || true
          git cherry-pick 36c5e266dbf2bba0df39a7f789615fa4a2ecb8c3 || true
          git cherry-pick ce2f799f7d21d266c08331173480c3fc19f0e89a || true
          git cherry-pick c15da63bd1b11d0de0ed4ab0f9693ebaf0fdddc0 || true
          git cherry-pick 33822df8a58dc9b47a3221bbaf26e1b69254beae

      - name: cherry-pick for version > 1.5.2
        if: steps.get_version.outputs.category == 'after_1_5_2'
        run: |
          cd $GITHUB_WORKSPACE
          git cherry-pick c15da63bd1b11d0de0ed4ab0f9693ebaf0fdddc0 || true

      - name: Install System Dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            python3-pip \
            python3-dev \
            tree \
            zip \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Build validator GUI
        id: build_gui
        shell: bash
        run: |
          set -e
          tree -L 3 -d
          source /opt/ros/humble/setup.bash
          
          # Use locally built lanelet2 from shared install (for Python)
          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/lanelet2/install_shared:$GITHUB_WORKSPACE/autoware_ws/install:${CMAKE_PREFIX_PATH}"
          export PYTHONPATH="$GITHUB_WORKSPACE/lanelet2/install_shared/lib/python3.10/site-packages:${PYTHONPATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lanelet2/install_shared/lib:$GITHUB_WORKSPACE/autoware_lanelet2_extension/autoware_lanelet2_extension/install/lib:$GITHUB_WORKSPACE/autoware_lanelet2_extension_python_ws/install/lib:${LD_LIBRARY_PATH}"
          
          source $GITHUB_WORKSPACE/autoware_lanelet2_extension_python_ws/install/setup.bash || true
          source $GITHUB_WORKSPACE/autoware_ws/install/setup.bash || true

          cd autoware_lanelet2_map_validator/gui

          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyinstaller
          
          # Verify imports work before building
          echo "Testing imports..."
          python3 -c "import lanelet2; print(f'lanelet2: {lanelet2.__file__}')" || echo "Warning: lanelet2 import failed"
          python3 -c "import autoware_lanelet2_extension_python; print(f'autoware_lanelet2_extension_python: {autoware_lanelet2_extension_python.__file__}')" || echo "Warning: autoware_lanelet2_extension_python import failed"
          
          SPEC_FILE=map_validator_gui3.spec

          pyinstaller "$SPEC_FILE"

          GUI_BIN=dist/autoware_lanelet2_map_validator_gui
          if [ ! -f "$GUI_BIN" ]; then
            GUI_BIN=$(find dist -maxdepth 2 -type f -executable | head -n 1)
          fi
          ls -l "$GUI_BIN"
          if [ -n "$GUI_BIN" ]; then
            echo "gui_artifact=$(realpath $GUI_BIN)" >> $GITHUB_OUTPUT
          fi
          cd ../..

      - name: Package artifacts
        id: package
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          ZIP_NAME="autoware_lanelet2_map_validator-${VERSION}-linux-x86_64.zip"
          mkdir release_package
          cp "${{ steps.build_validator.outputs.artifact }}" release_package/
          cp "${{ steps.build_gui.outputs.gui_artifact }}" release_package/
          cp -r autoware_lanelet2_map_validator/config release_package/
          cp -r autoware_lanelet2_map_validator/map_requirements release_package/
          strip release_package/autoware_lanelet2_map_validator || true
          zip -r $ZIP_NAME release_package
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Sign the package with GPG
        id: gpg-sign
        run: |
          GPG_KEY="${{ secrets.GPG_PRIVATE_KEY }}"
          if [ -z "$GPG_KEY" ] || [ "$GPG_KEY" = "" ]; then
            echo "GPG_PRIVATE_KEY secret not set, skipping signing"
            echo "signature_name=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$GPG_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" -o ${{ steps.package.outputs.zip_name }}.asc ${{ steps.package.outputs.zip_name }}
          echo "signature_name=${{ steps.package.outputs.zip_name }}.asc" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI
        run: |
          (type -p wget >/dev/null || (sudo apt-get update && sudo apt-get install wget -y))
          sudo mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee  > /dev/null
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Create or verify GitHub Release
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Check if release exists, if not create it
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION does not exist, creating it..."
            gh release create "$VERSION" --draft=false --generate-notes || true
          else
            echo "Release $VERSION already exists"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to GitHub Release
        run: |
          if [ -n "${{ steps.gpg-sign.outputs.signature_name }}" ]; then
            gh release upload "${{ steps.get_version.outputs.version }}" \
              "${{ steps.package.outputs.zip_name }}" \
              "${{ steps.gpg-sign.outputs.signature_name }}" \
              --clobber
          else
            gh release upload "${{ steps.get_version.outputs.version }}" \
              "${{ steps.package.outputs.zip_name }}" \
              --clobber
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
