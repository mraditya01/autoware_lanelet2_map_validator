name: build-and-upload-gui-binaries

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: The name of the tag to build and upload GUI binaries for
        type: string
        required: true

permissions:
  contents: write

jobs:
  build-gui:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/autowarefoundation/autoware:core-devel
      options: --user root

    steps:
      - name: Get Release Version
        id: get_version
        run: |
          REF_NAME="${{ github.event.inputs.tag-name }}"
          VERSION=${REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Split into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Default values to 0 if missing
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Reference version 1.5.2
          REF_MAJOR=1
          REF_MINOR=5
          REF_PATCH=2

          # Compare version parts
          if (( MAJOR < REF_MAJOR )) || \
             (( MAJOR == REF_MAJOR && MINOR < REF_MINOR )) || \
             (( MAJOR == REF_MAJOR && MINOR == REF_MINOR && PATCH <= REF_PATCH )); then
            CATEGORY="before_or_equal_1_5_2"
          else
            CATEGORY="after_1_5_2"
          fi

          echo "Category: $CATEGORY"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.get_version.outputs.version }}

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /__w/autoware_lanelet2_map_validator/autoware_lanelet2_map_validator
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Cherry-pick preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main static_build_helper

      - name: cherry-pick for version <= 1.5.2
        if: steps.get_version.outputs.category == 'before_or_equal_1_5_2'
        run: |
          git cherry-pick b92492bb2232f0c1d502cfc0c6aede2f3169116b
          git cherry-pick 8ed41f2f8d59d63c09bb47ac8ad59d4f56c7d07c
          git cherry-pick 36c5e266dbf2bba0df39a7f789615fa4a2ecb8c3
          git cherry-pick c15da63bd1b11d0de0ed4ab0f9693ebaf0fdddc0

      - name: cherry-pick for version > 1.5.2
        if: steps.get_version.outputs.category == 'after_1_5_2'
        run: |
          git cherry-pick c15da63bd1b11d0de0ed4ab0f9693ebaf0fdddc0

      - name: Install GUI Dependencies
        run: |
          set -e
          apt-get update
          apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libdbus-1-3 \
            libxss1 \
            libgconf-2-4 \
            libxtst6 \
            libxrandr2 \
            libasound2 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libcairo-gobject2 \
            libgtk-3-0 \
            libgdk-pixbuf2.0-0 \
            upx-ucl \
            binutils \
            zip \
            unzip
          rm -rf /var/lib/apt/lists/*

      - name: Setup Python Environment
        shell: bash
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          cd autoware_lanelet2_map_validator/gui
          python3 -m pip install --upgrade pip
          pip3 install pyinstaller
          pip3 install -r requirements.txt

      - name: Build GUI Binary
        id: build_gui
        shell: bash
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          cd autoware_lanelet2_map_validator/gui
          
          # Set environment variables for PyInstaller
          export ROS_DISTRO=humble
          export PYTHONPATH="/opt/ros/humble/lib/python3.10/site-packages:$PYTHONPATH"
          
          # Build the GUI binary using PyInstaller
          pyinstaller map_validator_gui3.spec --clean --noconfirm
          
          # Check if binary was created
          GUI_BIN="dist/map_validator_gui"
          if [ -f "$GUI_BIN" ]; then
            echo "GUI binary built successfully"
            ls -la "$GUI_BIN"
            echo "gui_artifact=$(realpath $GUI_BIN)" >> $GITHUB_OUTPUT
          else
            echo "Error: GUI binary not found"
            ls -la dist/
            exit 1
          fi

      - name: Package GUI artifacts
        id: package
        run: |
          set -e
          VERSION=${{ steps.get_version.outputs.version }}
          ZIP_NAME="autoware_lanelet2_map_validator_gui-${VERSION}-linux-x86_64.zip"
          mkdir release_package
          
          # Copy GUI binary
          cp "${{ steps.build_gui.outputs.gui_artifact }}" release_package/
          
          # Copy configuration files needed by GUI
          cp -r autoware_lanelet2_map_validator/config release_package/
          cp -r autoware_lanelet2_map_validator/map_requirements release_package/
          
          # Strip binary to reduce size
          strip release_package/map_validator_gui || true
          
          # Create ZIP package
          zip -r $ZIP_NAME release_package
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI
        run: |
          apt-get update
          apt-get install -y wget gpg
          mkdir -p -m 755 /etc/apt/keyrings
          wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          apt-get update
          apt-get install -y gh

      - name: Upload GUI artifacts to GitHub Release
        run: |
          gh release upload "${{ steps.get_version.outputs.version }}" \
            "${{ steps.package.outputs.zip_name }}" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
